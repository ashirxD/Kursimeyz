{{>top}}
              <!-- Not used by the shop today; kept on the same theme so it is ready if it ever is. -->
              <div class="hero">
                <table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                  <tr>
                    <td valign="bottom" style="padding-right:4px;"><img src="cid:orange" width="50" height="50" alt="" class="sticker"></td>
                    <td><img src="cid:plant" width="120" height="120" alt="A smiling plant" class="sticker"></td>
                    <td valign="bottom" style="padding-left:4px;"><img src="cid:apple" width="50" height="50" alt="" class="sticker"></td>
                  </tr>
                </table>
                <div class="pill">You are enrolled</div>
                <h1 class="h1">{{courseTitle}}</h1>
                <p class="sub">We are glad you are here.</p>
              </div>

              <div class="body">
                <p class="lead">Hello {{name}},</p>
                <p>You are all set. Here are the details of your course.</p>

                <table role="presentation" class="info" width="100%" cellpadding="0" cellspacing="0">
                  <tr><td class="label">Instructor</td><td class="value">{{instructorName}}</td></tr>
                  <tr><td class="label">Duration</td><td class="value">{{courseDuration}}</td></tr>
                  <tr><td class="label">Level</td><td class="value">{{courseLevel}}</td></tr>
                </table>

                <p class="center" style="margin:30px 0 4px;">
                  <a class="btn" href="{{courseUrl}}">Start learning</a>
                </p>
              </div>
{{>bottom}}
