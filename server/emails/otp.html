{{>top}}
              <div class="hero">
                <table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                  <tr>
                    <td valign="bottom" style="padding-right:4px;"><img src="cid:lemon" width="50" height="50" alt="" class="sticker"></td>
                    <td><img src="cid:lock" width="120" height="120" alt="A smiling padlock" class="sticker"></td>
                    <td valign="bottom" style="padding-left:4px;"><img src="cid:pear" width="50" height="50" alt="" class="sticker"></td>
                  </tr>
                </table>
                <h1 class="h1">{{heading}}</h1>
                <p class="sub">A quick check that it is really you.</p>
              </div>

              <div class="body">
                <p class="lead">Hello there,</p>
                <p>{{intro}}</p>

                <div class="otp">
                  <div class="otp-label">Your code</div>
                  <div class="otp-code">{{otp}}</div>
                </div>

                <div class="note"><strong>Keep it to yourself.</strong> This code works for the next <strong>10 minutes</strong>, and we will never ask you to share it. If you did not ask for it, you can safely ignore this email.</div>
              </div>
{{>bottom}}
